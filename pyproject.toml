[project]
name = "finalscoring"
version = "0.0.1"
description = "A critic-focused review aggregation index for board games."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "The Final Scoring contributors" },
]
keywords = ["board games", "reviews", "aggregator", "critics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
]
dependencies = []

[project.urls]
Homepage = "https://finalscoring.games/"
Repository = "https://gitlab.com/finalscoring/finalscoring"
Issues = "https://gitlab.com/finalscoring/finalscoring/-/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff>=0.15.0",
  "ty>=0.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finalscoring"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
]
ignore = [
  "E501",  # line too long — formatter handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
