name: weekly-rebuild

# Runs every Monday at 04:00 UTC. Triggers a fresh ingestion + build
# of the production database image.
#
# This is the placeholder version: it runs lint and tests, but does NOT
# yet push an image. Wiring up the image push requires:
#   - a self-hosted runner with GPU access (for local LLM extraction),
#   - container-registry credentials,
#   - the Recommend.Games game snapshot export step.
# All three are deferred until Phase 2 of the roadmap.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run a no-LLM build to verify orchestration
        env:
          # No LLM key in scheduled context — runs the build orchestrator
          # against empty results/, exercising the path without doing
          # actual extraction.
          LLM_API_BASE_URL: ""
          LLM_API_KEY: "local"
        run: |
          fs build --db-path /tmp/final_scoring.db || \
            (echo "::error::Weekly rebuild dry-run failed" && exit 1)

      # TODO: real ingestion + image build + push, once the build host
      # with GPU access exists.
