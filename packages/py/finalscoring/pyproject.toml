[project]
name = "finalscoring"
version = "0.1.0"
description = "Shared Python core for Final Scoring"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.40",
  "scrapy>=2.13.0",
  "polars>=1.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
