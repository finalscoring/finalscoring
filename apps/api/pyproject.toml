[project]
name = "finalscoring-api"
version = "0.1.0"
description = "FastAPI backend for Final Scoring"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.8.0",
  "finalscoring",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.11.0",
]

[tool.uv.sources]
finalscoring = { path = "../../packages/py/finalscoring", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
