# CI for Final Scoring. GitLab CI only — see AGENTS.md.
#
# Fast checks (ruff lint, ruff format, ty, pytest) run on every push and MR.
# Spider contracts run nightly on a schedule, never as a merge gate: they hit
# live sites, so a failure means "a site changed or is down", not "this commit
# is bad". Add a pipeline schedule (Build > Pipeline schedules) on `main` for it.
# The Docker image is built and pushed to the GitLab Container Registry only on
# merge to `main`.

stages:
  - check
  - build

variables:
  UV_VERSION: "0.12.6"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null

.uv:
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir "uv==$UV_VERSION"
    - uv sync --frozen
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

.fast-check:
  extends: .uv
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

ruff-lint:
  extends: .fast-check
  script:
    - uv run ruff check

ruff-format:
  extends: .fast-check
  script:
    - uv run ruff format --check --diff

ty:
  extends: .fast-check
  script:
    - uv run ty check

pytest:
  extends: .fast-check
  script:
    - uv run pytest

spider-contracts:
  extends: .uv
  stage: check
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - uv run scrapy check

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
